name: build docker images

# Controls when the workflow will run
on:
  push:
    branches:
      - '*'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  pull_request:
    branches:
      - '*'
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r dashboard/backend/requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: ruff check --isolated src/iSponsorBlockTV/config_store.py src/iSponsorBlockTV/helpers.py src/iSponsorBlockTV/main.py dashboard/backend tests
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: dashboard/frontend

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: isponsorblocktv
            dockerhub_image: dmunozv04/isponsorblocktv
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386,linux/arm/v6
          - image: isponsorblocktv-dashboard
            dockerhub_image: ""
            dockerfile: dashboard/Dockerfile
            platforms: linux/amd64,linux/arm64
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      PUBLISH_IMAGES: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      # Get the repository's code
      - name: Checkout
        uses: actions/checkout@v7

      # Generate docker tags
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ env.DOCKERHUB_USERNAME && matrix.dockerhub_image || '' }}
          tags: |
            type=raw,value=develop,priority=900,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,enable=true,priority=600,prefix=pr-,suffix=,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=schedule

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: env.PUBLISH_IMAGES == 'true' && env.DOCKERHUB_USERNAME != '' && matrix.dockerhub_image != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
